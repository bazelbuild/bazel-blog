  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }} - Bazel</title>

    <link rel="canonical" href="{{ page.url | replace:'index.html','' | prepend: site_root }}">
    <link rel="alternate" type="application/rss+xml" title="Bazel Blog" href="/feed.xml">

    <!-- Webfont (Inter & JetBrains Mono, matching bazel.build) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:ital,wght@0,400..600;1,400..600&display=swap" rel="stylesheet">

    <link rel="icon" type="image/png" href="/images/favicon-32x32.png" sizes="32x32">
    <link rel="icon" type="image/png" href="/images/favicon-16x16.png" sizes="16x16">

    <!-- Bootstrap -->
    <link href="/assets/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/css/font-awesome.min.css" rel="stylesheet">

    <!-- Custom stylesheet -->
    <link rel="stylesheet" type="text/css" href="/css/main.css">

    <!-- metadata -->
    <meta name="og:title" content="{{ page.title }}">
    <meta name="og:image" content="{{ site.assets_url }}/images/bazel-og-image.png">

    <!-- Twitter card -->
    <meta name="twitter:card" value="summary" />
  </head>
