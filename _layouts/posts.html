nav: blog
---

<!DOCTYPE html>
<html lang="en" itemscope itemtype="https://schema.org/WebPage">
  {% include head.html %}
  <body>
    {% include header.html %}

    <div class="container vpad">
      <div class="row">
        <div class="col-lg-12">
          <article class="blog-post blog-post-single">
            <a href="/" class="blog-eyebrow">&larr; Bazel Blog</a>
            <h1 class="blog-post-title">{{ page.title }}</h1>
            <div class="blog-post-meta">
              {% include byline.html authors=page.authors date=page.date %}
            </div>
            <div class="blog-post-content">
              {{ content }}
            </div>
            {% if page.enable_comments %}
            <div class="blog-post-comments">
              <div id="disqus_thread"></div>
              <script type="text/javascript">
                var disqus_shortname = 'googlebazel';

                (function() {
                  var dsq = document.createElement('script'); dsq.type = 'text/javascript'; dsq.async = true;
                  dsq.src = '//' + disqus_shortname + '.disqus.com/embed.js';
                  (document.getElementsByTagName('head')[0] || document.getElementsByTagName('body')[0]).appendChild(dsq);
                })();
              </script>
              <noscript>Please enable JavaScript to view the <a href="https://disqus.com/?ref_noscript" rel="nofollow">comments powered by Disqus.</a></noscript>
            </div>
            {% endif %}
          </article>
        </div>
      </div>
    </div>

    {% include footer.html %}

    <!-- Anchor JS -->
    <script type="text/javascript" src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/3.2.0/anchor.min.js"></script>
    <script>
      // Automatically add anchors and links to all header elements that don't already have them.
      anchors.add('.blog-post-content h2, .blog-post-content h3, .blog-post-content h4');
    </script>
  </body>
</html>
